packages:
  - "."

# pnpm 11: approve build scripts for all dependencies that need them.
# esbuild, sharp, and workerd have postinstall/build scripts that are
# required for the project to function. The default pnpm 11 security
# mode rejects these with ERR_PNPM_IGNORED_BUILDS, which is what was
# breaking the CI "Install dependencies" step.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

dangerouslyAllowAllBuilds: true
